<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Human Controller</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #e0e0e0;
            height: 100vh;
            box-sizing: border-box;
        }
        
        .container {
            display: flex;
            height: 100%;
            gap: 20px;
        }
        
        .column {
            background: white;
            border: 2px solid #000;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .col-left {
            flex: 2;
            min-width: 300px;
        }

        .col-center {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .col-right {
            flex: 2;
            min-width: 300px;
        }

        h2 {
            margin-top: 0;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            text-transform: uppercase;
            font-size: 1.2rem;
        }

        /* User/Group Styles */
        .group-container {
            margin-bottom: 15px;
            border: 1px solid #ccc;
            padding: 10px;
        }

        .group-header {
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            background: #eee;
            padding: 5px;
            cursor: pointer;
        }

        .user-item {
            padding: 5px;
            margin: 2px 0;
            background: #f9f9f9;
            border: 1px solid #ddd;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .user-item:hover {
            background: #f0f0f0;
        }

        .user-item.selected, .group-header.selected {
            background-color: #b3d9ff;
            border-color: #66b3ff;
        }
        
        .user-status {
            font-size: 0.8rem;
            color: #666;
        }

        /* Audio File Styles */
        .audio-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .audio-item:hover {
            background: #f5f5f5;
        }

        .audio-item.selected {
            background-color: #b3d9ff;
        }

        /* Controls */
        button {
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border: 2px solid #000;
            background: white;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s;
        }

        button:hover {
            background: #eee;
        }

        button:active {
            transform: translateY(2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            border-width: 3px;
        }

        /* Drag and Drop visual cues */
        .group-users {
            min-height: 30px;
        }
        
        .dragging {
            opacity: 0.5;
        }

        .checkbox {
            margin-right: 10px;
            width: 20px;
            height: 20px;
        }
        
        #selectAllWrapper {
            margin-top: auto;
            padding-top: 10px;
            border-top: 2px solid #000;
        }
    </style>
</head>
<body>
    <div class="container" style="margin-top: 50px;">
        <!-- Header Bar -->
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 50px; background: #333; color: white; display: flex; align-items: center; padding: 0 20px; z-index: 100;">
            <h1 style="margin: 0; font-size: 1.2rem; border: none;">Last Human Admin</h1>
            <div style="margin-left: auto; font-family: monospace; font-size: 1.2rem;">
                SYNC TIME: <span id="globalTimer">00:00</span>
            </div>
        </div>

        <!-- Left Column: Users & Groups -->
        <div class="column col-left">
            <h2>BACKGROUND TRACK GROUPS</h2>
            <div id="groupsContainer">
                <!-- Groups 1-6 will be generated here -->
            </div>
            
            <div style="margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #ccc;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Number of Groups:</label>
                <input type="range" id="groupCountSlider" min="1" max="6" value="6" style="width: 100%;">
                <div style="text-align: center; font-weight: bold;">
                    <span id="groupCountLabel">6</span> Groups
                </div>
                <button id="applyGroupCountBtn" style="margin-top: 5px; font-size: 0.8rem; padding: 5px;">Apply Group Count (Resets Experience)</button>
            </div>

            <div id="selectAllWrapper">
                <label style="display: flex; align-items: center; font-weight: bold; font-size: 1.1rem;">
                    <input type="checkbox" class="checkbox" id="selectAllBtn"> Select All Players
                </label>
            </div>
        </div>

        <!-- Center Column: Controls -->
        <div class="column col-center">
            <h2>Controls</h2>
            
            <div style="width: 100%; margin-bottom: 20px; border-bottom: 2px solid #ccc; padding-bottom: 20px;">
                <button id="playStemBtn" style="background: #d4edda; margin-bottom: 10px;">START MAIN TRACKS</button>
                <button id="pauseStemBtn" style="background: #fff3cd;">PAUSE MAIN TRACKS</button>
            </div>

            <div style="width: 100%; margin-bottom: 20px; border-bottom: 2px solid #ccc; padding-bottom: 15px;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px; font-size: 0.9rem;">Background Track:</label>
                <select id="backgroundTrackSelect" style="width: 100%; padding: 8px; font-size: 0.85rem;">
                    <option value="">(None - Silent when paused)</option>
                </select>
                <p style="font-size: 0.75rem; color: #666; margin: 5px 0 0 0;">Plays when main tracks are paused</p>
            </div>

            <button id="sortPlayersBtn">Sort Players</button>
            <button id="resetExperienceBtn" style="background: #d1ecf1; margin-top: 10px;">Reset Experience</button>
            
            <div style="height: 20px;"></div>
            
            <div style="border: 2px solid #000; padding: 10px; background: #f8f9fa;">
                <h3 style="margin-top: 0; text-align: center;">CUE CONTROL</h3>
                <button id="loadCueBtn" disabled style="background: #ffc107; margin-bottom: 5px;">LOAD CUE</button>
                <button id="triggerCuesBtn" disabled style="background: #dc3545; color: white; font-size: 1.1rem; padding: 20px;">TRIGGER ALL CUES</button>
                
                <div style="display: flex; gap: 10px; margin-top: 5px;">
                    <button id="stopAudioBtn" disabled style="background: #f8d7da; flex: 1;">STOP TRIGGERED CUE</button>
                    <button id="clearCuesBtn" disabled style="background: #e2e6ea; flex: 1;">Clear Pending Cues</button>
                </div>
                <div style="margin-top: 15px; padding-top: 10px; border-top: 1px solid #ccc;">
                    <label style="display: flex; align-items: center; cursor: pointer;">
                        <input type="checkbox" id="isLastClip" class="checkbox">
                        <strong>Last Clip (Do not resume main track)</strong>
                    </label>
                </div>
            </div>

            
        </div>

        <!-- Right Column: Audio Files -->
        <div class="column col-right">
            <h2>Audio Files</h2>
            <div id="audioList">
                <!-- Audio files will be generated here -->
            </div>
            
            <div id="hiddenFilesContainer" style="margin-top: 20px; border-top: 2px dashed #ccc; padding-top: 10px; display: none;">
                <h3 style="font-size: 1rem; color: #666; cursor: pointer; display: flex; align-items: center;" onclick="toggleHiddenList()">
                    <span id="hiddenListArrow" style="margin-right: 5px; display: inline-block; transform: rotate(-90deg); transition: transform 0.2s;">▼</span>
                    Hidden Tracks (<span id="hiddenCount">0</span>)
                </h3>
                <div id="hiddenAudioList" style="opacity: 0.6; display: none; padding-left: 10px;">
                    <!-- Hidden files -->
                </div>
            </div>

            <div style="margin-top: auto; padding-top: 10px; border-top: 1px solid #ccc;">
                <h3>Upload</h3>
                <form action="/upload" method="post" enctype="multipart/form-data">
                    <input type="file" name="audioFile" accept="audio/*" required>
                    <button type="submit" style="margin-top: 5px; padding: 5px;">Upload</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
