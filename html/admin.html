<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Last Human Controller</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #e0e0e0;
            height: 100vh;
            box-sizing: border-box;
        }
        
        .container {
            display: flex;
            height: 100%;
            gap: 20px;
        }
        
        .column {
            background: white;
            border: 2px solid #000;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .col-left {
            flex: 2;
            min-width: 300px;
        }

        .col-center {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .col-right {
            flex: 2;
            min-width: 300px;
        }

        h2 {
            margin-top: 0;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            text-transform: uppercase;
            font-size: 1.2rem;
        }

        /* User/Group Styles */
        .group-container {
            margin-bottom: 15px;
            border: 1px solid #ccc;
            padding: 10px;
        }

        .group-header {
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            background: #eee;
            padding: 5px;
            cursor: pointer;
        }

        .user-item {
            padding: 5px;
            margin: 2px 0;
            background: #f9f9f9;
            border: 1px solid #ddd;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .user-item:hover {
            background: #f0f0f0;
        }

        .user-item.selected, .group-header.selected {
            background-color: #b3d9ff;
            border-color: #66b3ff;
        }
        
        .user-status {
            font-size: 0.8rem;
            color: #666;
        }

        /* Audio File Styles */
        .audio-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .audio-item:hover {
            background: #f5f5f5;
        }

        .audio-item.selected {
            background-color: #b3d9ff;
        }

        /* Controls */
        button {
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border: 2px solid #000;
            background: white;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s;
        }

        button:hover {
            background: #eee;
        }

        button:active {
            transform: translateY(2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            border-width: 3px;
        }

        /* Drag and Drop visual cues */
        .group-users {
            min-height: 30px;
        }
        
        .dragging {
            opacity: 0.5;
        }

        .checkbox {
            margin-right: 10px;
            width: 20px;
            height: 20px;
        }
        
        #selectAllWrapper {
            margin-top: auto;
            padding-top: 10px;
            border-top: 2px solid #000;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Column: Users & Groups -->
        <div class="column col-left">
            <h2>Groups</h2>
            <div id="groupsContainer">
                <!-- Groups 1-6 will be generated here -->
            </div>
            
            <div id="selectAllWrapper">
                <label style="display: flex; align-items: center; font-weight: bold; font-size: 1.1rem;">
                    <input type="checkbox" class="checkbox" id="selectAllBtn"> Select All Players
                </label>
            </div>
        </div>

        <!-- Center Column: Controls -->
        <div class="column col-center">
            <h2>Controls</h2>
            
            <div style="width: 100%; margin-bottom: 20px; border-bottom: 2px solid #ccc; padding-bottom: 20px;">
                <button id="playStemBtn" style="background: #d4edda; margin-bottom: 10px;">START STEMS</button>
                <button id="pauseStemBtn" style="background: #fff3cd;">PAUSE STEMS</button>
            </div>

            <button id="sortPlayersBtn">Sort Players</button>
            <button id="resetExperienceBtn" style="background: #d1ecf1; margin-top: 10px;">Reset Experience</button>
            
            <div style="height: 20px;"></div>
            
            <button id="applyAudioBtn" disabled>APPLY AUDIO</button>
            <button id="stopAudioBtn" disabled style="background: #f8d7da;">STOP AUDIO</button>

            <div style="margin-top: 15px; padding-top: 10px; border-top: 1px solid #ccc;">
                <label style="display: flex; align-items: center; cursor: pointer;">
                    <input type="checkbox" id="isLastClip" class="checkbox">
                    <strong>Last Clip (Do not resume stem)</strong>
                </label>
            </div>
        </div>

        <!-- Right Column: Audio Files -->
        <div class="column col-right">
            <h2>Audio Files</h2>
            <div id="audioList">
                <!-- Audio files will be generated here -->
            </div>
            <div style="margin-top: auto; padding-top: 10px; border-top: 1px solid #ccc;">
                <h3>Upload</h3>
                <form action="/upload" method="post" enctype="multipart/form-data">
                    <input type="file" name="audioFile" accept="audio/*" required>
                    <button type="submit" style="margin-top: 5px; padding: 5px;">Upload</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
