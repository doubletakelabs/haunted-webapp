<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HVB Admin Panel</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0a0a0a;
            color: #cfcfcf;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: rgba(20, 20, 20, 0.95);
            padding: 20px;
            border: 2px solid #888;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.1);
        }
        h1 {
            text-align: center;
            color: #8affff;
            margin-bottom: 30px;
        }
        .control-panel {
            margin-bottom: 30px;
            padding: 20px;
            background-color: #141414;
            border: 1px solid #444;
        }
        .control-panel h2 {
            color: #ff8aff;
            margin-top: 0;
        }
        button {
            font-family: 'Courier New', Courier, monospace;
            background-color: #111;
            color: #cfcfcf;
            border: 2px solid #555;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            box-shadow: 0 0 4px #999;
        }
        button:hover {
            background-color: #222;
        }
        button#chooseLastHuman {
            background-color: #1a1a1a;
            border-color: #ff8aff;
            color: #ffff00;
        }
        button#chooseLastHuman:hover {
            background-color: #222;
        }
        .user-list {
            margin-top: 20px;
        }
        .user-item {
            padding: 10px;
            margin: 5px 0;
            background-color: #1a1a1a;
            border: 1px solid #333;
        }
        .user-item.human {
            border-left: 4px solid #8affff;
        }
        .user-item.bot {
            border-left: 4px solid #ff8aff;
        }
        .status-info {
            margin-top: 20px;
            padding: 10px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HVB Admin Panel</h1>
        
        <div class="control-panel">
            <h2>Experience Control</h2>
            <button id="resetRoles">Reset All Roles</button>
            <button id="chooseLastHuman">Choose Last Human</button>
        </div>

        <div class="control-panel">
            <h2>Connected Users</h2>
            <div id="userList" class="user-list">
                <!-- User list will be populated here -->
            </div>
        </div>

        <div class="control-panel">
            <h2>Status Log</h2>
            <div id="statusInfo" class="status-info"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
